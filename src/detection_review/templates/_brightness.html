<div class="brightness-filter" id="brightness-filter">
  <label for="brightness-slider">Brightness <span id="brightness-label">100%</span></label>
  <div class="brightness-row">
    <input type="range" id="brightness-slider" min="50" max="400" value="100" step="10" aria-label="Image brightness" />
    <button type="button" id="brightness-reset" class="ghost">Reset</button>
  </div>
</div>
