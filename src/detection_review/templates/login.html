<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detection Review Tool</title>
  {% include "_fonts.html" %}
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}" />
</head>
<body class="auth-page">
  <main class="login-wrap">
    <p class="eyebrow">Detection Review Tool</p>
    <h1>
      {% if skip_dropdown and selected_study_id %}
        {{ selected_study_id }}
      {% else %}
        Sign in
      {% endif %}
    </h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="login-form">
      {% if skip_dropdown %}
      <input type="hidden" name="study_id" value="{{ selected_study_id }}" />
      {% else %}
      <label>Study
        <select name="study_id" required>
          <option value="" disabled {% if not selected_study_id %}selected{% endif %}>Choose a study</option>
          {% for s in studies %}
          <option value="{{ s.study_id }}" {% if s.study_id == selected_study_id %}selected{% endif %}>{{ s.study_id }}</option>
          {% endfor %}
        </select>
      </label>
      {% endif %}
      <label>Tester name
        <input name="tester" required autocomplete="username" placeholder="alice" value="{{ tester or '' }}" />
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="primary">Enter study</button>
    </form>
  </main>
</body>
</html>
