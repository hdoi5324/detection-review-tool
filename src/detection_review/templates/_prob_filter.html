<div class="prob-filter" id="prob-filter">
  <label>Probability <span id="prob-range-label">0.7 – 1.0</span></label>
  <div class="dual-range">
    <div class="dual-range-track" id="prob-track"></div>
    <input type="range" id="prob-min" min="0" max="10" value="7" step="1" aria-label="Minimum probability" />
    <input type="range" id="prob-max" min="0" max="10" value="10" step="1" aria-label="Maximum probability" />
  </div>
</div>
