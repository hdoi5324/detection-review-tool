[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-review-tool"
version = "0.1.0"
description = "Two-stage timed review tool for object-detection predictions (COCO format)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "itsdangerous>=2.1",
    "python-dotenv>=1.0",
]

[project.scripts]
detection-review = "detection_review.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detection_review = ["templates/*", "static/*"]
